<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>
    <h1>Login</h1>

    {% if form.errors %}
        <p style="color: red;">Your username and password didn't match. Please try again.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        
        <div>
            <label for="id_username">Username:</label>
            {{ form.username }}
        </div>

        <div>
            <label for="id_password">Password:</label>
            {{ form.password }}
        </div>

        <button type="submit">Login</button>
    </form>
</body>
</html>
