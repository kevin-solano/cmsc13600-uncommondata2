<!DOCTYPE html>
<html>
<head>
    <title>Create New User</title>
</head>
<body>
    <h1>Create New User</h1>
    
    #always
    <div style="display: none;">
        <input type="hidden" name="user_name" value="{{ user_name|default:'' }}">
    </div>

    {% if user_name %}
        <p>Logged in as: {{ user_name }}</p>
    {% else %}
        <p>Not logged in</p>
    {% endif %}
    
    <form method="POST" action="/app/api/createUser/">
        {% csrf_token %}
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div>
            <label>User Type:</label>
            <input type="radio" id="harvestor" name="user_type" value="harvester" checked>
            <label for="harvestor">Harvester</label>
            <input type="radio" id="curator" name="user_type" value="curator">
            <label for="curator">Curator</label>
        </div>
        <button type="submit">Create User</button>
    </form>
</body>
</html>
