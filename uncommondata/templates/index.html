<!DOCTYPE html>
<html>
<head>
    <title>Home</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 600px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome</h1>
        <div id="user-info">
            {% if user.is_authenticated %}
                <p>Logged in as: {{ user.email }}</p>
            {% else %}
                <p>Not logged in</p>
            {% endif %}
        </div>
        <p>Current time: {% now "Y-m-d H:i:s" %}</p>
        <p>Bio: This is a simple Django application.</p>
    </div>
</body>
</html>
